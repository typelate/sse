name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go test -bench=. -benchmem -run=^$ -benchtime=1x ./...
